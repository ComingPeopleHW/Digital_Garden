services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-garden-postgres
    environment:
      POSTGRES_DB: digital_garden
      POSTGRES_USER: digital_garden
      POSTGRES_PASSWORD: digital_garden
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_garden -d digital_garden"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

