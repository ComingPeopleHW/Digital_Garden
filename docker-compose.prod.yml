services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_garden}
      POSTGRES_USER: ${POSTGRES_USER:-digital_garden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digital_garden} -d ${POSTGRES_DB:-digital_garden}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-digital_garden}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digital_garden}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data:

